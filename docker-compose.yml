services:
  db:
    image: postgres:16-alpine
    container_name: parada1bus-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: parada1bus
      POSTGRES_USER: parada1bus
      POSTGRES_PASSWORD: parada1bus_secret
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
